[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantstation-vnext"
version = "0.1.0"
description = "Research-first US equity quantitative trading platform."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "duckdb>=1.0",
  "pydantic>=2.0",
  "psycopg[binary]>=3.1",
  "fastapi>=0.110",
  "pyarrow>=15.0",
  "PyYAML>=6.0",
  "uvicorn>=0.29",
  "websocket-client>=1.8,<2",
  "keyring>=25.0",
  "yfinance>=0.2.40"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "jsonschema>=4.0"
]
research = [
  "polars>=1.0",
  "exchange-calendars>=4.13; python_version >= '3.10'",
  "pandas-market-calendars>=5.4; python_version >= '3.10'",
  "quantstats>=0.0.64",
  "vectorbt>=0.28"
]
timesfm = [
  "timesfm[torch]>=2.0.1; python_version >= '3.10'"
]
integrations = [
  "pyqlib>=0.9.7",
  "lightgbm>=4.0",
  "PyPortfolioOpt>=1.5",
  "openbb>=4.4"
]
ibkr = [
  "ib_insync>=0.9.86"
]
live = [
  "vnpy>=3.9"
]
btc-public-ws = [
  "websocket-client>=1.8,<2"
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "integration_live: marks tests requiring live broker (skip in CI)",
    "e2e: end-to-end tests",
]

[project.scripts]
quant-us = "quant_us.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "quant_us*", "quant_shared*", "quant_cn*", "integrations*"]
namespaces = true
