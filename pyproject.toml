[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantstation-vnext"
version = "0.1.0"
description = "Research-first Bitcoin multi-strategy backtesting and analysis platform."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "duckdb>=1.0",
  "pydantic>=2.0",
  "psycopg[binary]>=3.1",
  "fastapi>=0.110",
  "pyarrow>=15.0",
  "PyYAML>=6.0",
  "uvicorn>=0.29",
  "yfinance>=0.2.40"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27"
]
research = [
  "polars>=1.0"
]
live = [
  "vnpy>=3.9"
]

[project.scripts]
quant-us = "quant_us.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "quant_us*"]
namespaces = true
