[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantstation-vnext"
version = "0.1.0"
description = "Research-first Bitcoin multi-strategy backtesting and analysis platform."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "pydantic>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.29"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27"
]
live = [
  "vnpy>=3.9"
]

[tool.setuptools]
packages = []
