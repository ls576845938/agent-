services:
  quant-api:
    build: .
    environment:
      QS_API_HOST: 0.0.0.0
      QS_API_PORT: 8000
      QS_DEFAULT_DATA_SOURCE: yfinance
      QS_DEFAULT_SYMBOL: SPY
      QS_DEFAULT_INTERVAL: 1d
      QS_ALLOW_FIXTURE_FALLBACK: "false"
      QS_DATA_DB_PATH: /app/data/market_data.sqlite
      QS_REPORT_DIR: /app/reports
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis

  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: quant
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  postgres-data:
  grafana-data:
