name: CI
on: [push, pull_request]
jobs:
  backend-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e ".[dev]" || pip install pytest pandas numpy
      - run: python -m pytest backend/tests/ -q -m "not integration_live and not slow" --tb=short

  backend-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -e ".[dev]" || pip install pytest pandas numpy
      - run: python -m pytest backend/tests/ -q -m "integration and not integration_live" --tb=short

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd frontend && npm ci
      - run: cd frontend && npx tsc --noEmit
      - run: cd frontend && npm run build

  safety-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pytest pandas numpy
      - run: |
          python -m pytest backend/tests/ -q -k "no_live or no_submit or no_real or no_broker or no_auto or safety or gate or lock or freeze or reduce_only" --tb=short
